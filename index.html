(() => {
  const $ = id => document.getElementById(id);
  const au = $('au'), big = $('big'), ic = $('ic'), sk = $('sk'), tm = $('tm'), frame = $('frame'), cta = $('cta'), site = null;
  const END = 132.0, HOLD = END - .8, CTA_T = T.fin + 3.6, SITE_T = T.fin + 3.9;   // final page stays on screen, never fades to black
  const PLAY = '<path d="M6 4l14 8-14 8z"/>', PAUSE = '<path d="M6 4h4v16H6zm8 0h4v16h-4z"/>';
  let t = 0, playing = false, started = false, last = performance.now(), scrub = false;
  const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  function size() {
    const w = frame.getBoundingClientRect().width; frame.style.setProperty('--s', (w / 1080).toFixed(4)); frame.style.setProperty('--cw', window.CTA_W ? window.CTA_W + 'px' : '560px');
    const q = Math.min(1, Math.max(.45, w * (window.devicePixelRatio || 1) / 1080)); window.setQ(Math.round(q * 20) / 20); window.GQ = Math.min(q, .7);
  }
  function play() { if (t >= HOLD - .05) t = 0; started = true; playing = true; big.hidden = true; ic.innerHTML = PAUSE; try { au.currentTime = t; } catch (e) {} au.play().catch(() => {}); }
  function stop() { playing = false; au.pause(); ic.innerHTML = PLAY; }
  function loop(now) {
    const dt = Math.min(.1, (now - last) / 1000); last = now;
    if (playing) { if (!au.paused && au.readyState >= 2) t = au.currentTime; else t += dt; if (t >= END || au.ended) { t = END; stop(); } }
    const rt = started ? Math.min(t, HOLD) : 2.6;
    window.render(rt);
    const onCta = started && rt >= CTA_T; cta.classList.toggle('on', onCta); 
    cta.tabIndex = onCta ? 0 : -1; 
    if (!scrub) sk.value = t; tm.textContent = `${fmt(t)} / 2:12`;
    requestAnimationFrame(loop);
  }
  big.onclick = play;
  $('pp').onclick = () => playing ? stop() : play();
  $('rs').onclick = () => { t = 0; try { au.currentTime = 0; } catch (e) {} if (!playing) play(); };
  sk.oninput = () => { scrub = true; started = true; big.hidden = true; t = +sk.value; try { au.currentTime = t; } catch (e) {} };
  sk.onchange = () => { scrub = false; };
  $('fs').onclick = () => { (frame.requestFullscreen ? frame.requestFullscreen() : Promise.reject()).catch(() => {}); };
  document.addEventListener('keydown', e => { if (e.code === 'Space' && !['BUTTON', 'A', 'INPUT'].includes(e.target.tagName)) { e.preventDefault(); playing ? stop() : play(); } });
  window.addEventListener('resize', size);
  cta.href = window.CTA_URL;
